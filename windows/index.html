const MENU=[{n:'Tempo',g:()=>G.bpm,s:v=>{G.bpm=Math.round(cl(v,60,200)*10)/10;applyG()},step:.5,fmt:v=>v.toFixed(1)},{n:'Pattern Länge',g:()=>G.len,s:v=>G.len=cl(Math.round(v),1,16)},{n:'LFO Ziel',g:()=>P[sel].v.mt||0,fmt:v=>['Cutoff','Pan','Amp'][v],s:v=>{P[sel].v.mt=cl(Math.round(v),0,2);apply(sel)}},{n:'MFX Typ',g:()=>G.mty,fmt:v=>['Reverb','Delay','Filter','Crusher','Flanger','Comp'][v],s:v=>{G.mty=cl(Math.round(v),0,5);applyG()}},{n:'Part zufällig',a:()=>{pushU();const p=P[sel];for(let i=0;i<16;i++)p.s[i]=Math.random()<.35?(isSyn(sel)?48+SC[Math.floor(Math.random()*8)]:(Math.random()<.2?2:1)):0;msg('Part '+(sel+1)+' zufällig');ui()}},{n:'Metronom',g:()=>met?'AN':'AUS',a:()=>{met^=1}},{n:'Part kopieren',a:()=>{pclip=JSON.stringify({s:P[sel].s,v:P[sel].v});msg('Part '+(sel+1)+' kopiert')}},{n:'Part einfügen',a:()=>{if(!pclip)return msg('Nichts kopiert');const d=JSON.parse(pclip);P[sel].s=d.s;P[sel].v={...DEF,...d.v};apply(sel);ui();msg('Part eingefügt')}},{n:'Part rotieren',a:()=>{pushU();P[sel].s.unshift(P[sel].s.pop());ui();msg('Part rotiert')}},{n:'Pattern leeren',a:()=>{pushU();P.forEach((p,i)=>{p.s.fill(0);M[i]={};L[i]=[]});ui();msg('Pattern geleert')}},{n:'Chain',g:()=>chainOn?'AN ('+chain.length+')':'AUS',a:()=>{if(!chain.length)return msg('Shift+Pad im Pattern Set');chainOn^=1;chainI=chain.indexOf(cur);if(chainI<0)chainI=0}},{n:'Chain leeren',a:()=>{chain=[];chainOn=0;msg('Chain leer')}},{n:'Undo',a:()=>{if(undo.length){applyData(JSON.parse(undo.pop()));applyG();ui();msg('Undo')}else msg('Nichts zum Undo')}},{n:'Audio In',g:()=>mic?'AN':'AUS',a:micToggle},{n:'Wellenform',g:()=>wf?'AN':'AUS',a:()=>{wf^=1;wv.style.display=wf?'block':'none';drawWv()}},{n:'Sample Start',g:()=>P[sel].v.ss||0,fmt:v=>v+'%',s:v=>{P[sel].v.ss=cl(Math.round(v),0,90)},step:5},{n:'Sample rückwärts',a:()=>{const b=S[sel];if(!b)return msg('Kein Sample');for(let c=0;c<b.numberOfChannels;c++)b.getChannelData(c).reverse();wv.cb=null;drawWv();msg('Sample rückwärts')}},{n:'Humanize',g:()=>G.hum||0,s:v=>G.hum=cl(Math.round(v),0,100),step:5},{n:'Transponieren',g:()=>G.tr||0,fmt:v=>(v>0?'+':'')+v,s:v=>G.tr=cl(Math.round(v),-12,12)},{n:'Gate Time',g:()=>P[sel].v.gt==null?100:P[sel].v.gt,fmt:v=>v+'%',s:v=>{P[sel].v.gt=cl(Math.round(v),5,100)},step:5},{n:'Chain Wdh',g:()=>G.cw||1,s:v=>G.cw=cl(Math.round(v),1,8)},{n:'MIDI Sync',g:()=>extS?'EXT':'INT',a:()=>{extS^=1;msg(extS?'Clock extern':'Clock intern')}},{n:'Swing',g:()=>G.sw,s:v=>G.sw=cl(Math.round(v),0,50)},
 {n:'Sample laden',a:()=>$('file').click()},{n:'Sample löschen',a:()=>{S[sel]=null;kv('del','smp'+sel);msg('Sample entfernt');drawWv()}},{n:'Backup sichern',a:backup},{n:'Backup laden',a:()=>$('bkf').click()},{n:MB?'MIDI Out (WLAN)':'MIDI Out (loopMIDI)',g:()=>mOn?'AN':'AUS',a:async()=>{if(MB||mOn){mOn=!mOn}else if(await wmInit()){mOn=true}ui()}},{n:'MIDI Port',g:()=>MB?'WLAN':wo?wo.name.slice(0,16):'-',a:()=>{if(wOuts.length)wo=wOuts[(wOuts.indexOf(wo)+1)%wOuts.length]}},{n:'Ton auf iPad',g:()=>lmute?'AUS':'AN',a:()=>{lmute=!lmute}},{n:'MIDI aktivieren',a:midi},{n:'Alles löschen',a:wipe}];
